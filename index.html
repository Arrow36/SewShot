<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf4ec"><meta name="description" content="SewShot：在浏览器本地拼接截图，自动识别重叠、手动调整接缝和裁剪，支持 PNG、JPG 与分段导出。"><meta name="author" content="Arrow36">
  <title>SewShot · 截图拼接</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=12">
</head>
<body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-leaf" viewBox="0 0 24 24"><path d="M19 4C8 2 3 7 5 14s15 5 14-10Z"/><path d="m5 20 10-11M10 15l-1-5"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-images" viewBox="0 0 24 24"><rect x="7" y="3" width="14" height="16" rx="3"/><path d="M3 7v13a2 2 0 0 0 2 2h12M8 15l4-4 3 3 2-2 4 4"/><circle cx="16" cy="8" r="1"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6L12 3ZM20 2v4M18 4h4"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9S4 17 4 12V6l8-3Z"/><path d="m8 12 3 3 5-6"/></symbol>
<symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 5M12 17h.01"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v16m-5-5 5 5 5-5"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="M4 12h16m-5-5 5 5-5 5"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V4m-5 5 5-5 5 5"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="m8 4-5 5 5 5M3 9h11a6 6 0 0 1 0 12"/></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="m16 4 5 5-5 5M21 9H10a6 6 0 0 0 0 12"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></symbol>
<symbol id="i-grip" viewBox="0 0 24 24"><path d="M8 5h.01M16 5h.01M8 12h.01M16 12h.01M8 19h.01M16 19h.01" stroke-width="3"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5M12 17h.01"/></symbol>
<symbol id="i-cut" viewBox="0 0 24 24"><path d="M3 12h18" stroke-dasharray="3 3"/><path d="M6 8V4h12v4M6 16v4h12v-4"/></symbol>
<symbol id="i-crop" viewBox="0 0 24 24"><path d="M6 3v15h15M3 6h15v15"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-fit" viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 16V3m-4 4 4-4 4 4M5 12v9h14v-9"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
<symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h8m4 0h4M4 17h3m4 0h9"/><circle cx="14" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
</defs></svg>
<div class="app">
  <header class="app-header"><button id="back" class="icon-button" aria-label="返回" hidden><svg class="back-icon"><use href="#i-right"/></svg></button><div id="brand" class="brand"><svg><use href="#i-leaf"/></svg>SewShot</div><h1 id="pageTitle" hidden>选择截图</h1><div id="historyActions" hidden><button id="undo" class="icon-button" aria-label="撤销"><svg><use href="#i-undo"/></svg></button><button id="redo" class="icon-button" aria-label="重做"><svg><use href="#i-redo"/></svg></button></div></header>
  <nav class="step-indicator" aria-label="当前步骤"><span class="active" aria-label="选择截图"></span><span aria-label="拼接"></span><span aria-label="导出"></span></nav>
  <main>
    <section id="selectScreen" class="screen">
      <div id="welcome" class="welcome"><div class="paper-art" aria-hidden="true"><div class="paper paper-back"><i></i><i></i><b></b></div><div class="paper paper-front"><b><svg><use href="#i-leaf"/></svg></b><i></i><i></i></div><span class="art-plus"><svg><use href="#i-plus"/></svg></span></div><button id="upload" class="button primary"><svg><use href="#i-plus"/></svg>上传</button><button id="resume" class="icon-button" hidden aria-label="返回已选截图"><svg><use href="#i-right"/></svg></button><button id="demo" class="icon-button demo-icon" title="试用示例" aria-label="试用示例"><svg><use href="#i-spark"/></svg></button></div>
      <div id="collection" class="collection" hidden><div class="collection-heading"><h2><svg><use href="#i-images"/></svg><span id="imageCount">0</span></h2></div><div id="imageList" class="image-list"></div><button id="add" class="add-tile" aria-label="继续添加截图"><svg><use href="#i-plus"/></svg></button><div class="direction-picker"><button id="vertical" class="selected" title="纵向" aria-label="纵向"><svg><use href="#i-down"/></svg></button><button id="horizontal" title="横向" aria-label="横向"><svg><use href="#i-right"/></svg></button></div></div>
      <div id="selectFooter" class="screen-footer" hidden><button id="previousSelect" class="button secondary previous-button" aria-label="上一步"><svg class="back-icon"><use href="#i-right"/></svg></button><button id="nextStitch" class="button primary full next-button" aria-label="下一步：拼接"><svg><use href="#i-right"/></svg></button></div>

    </section>
    <section id="stitchScreen" class="screen" hidden><div class="preview-caption"><button id="pendingButton" class="pending-button" hidden><i></i><span id="pendingCount"></span></button></div><div id="inlineToolbar" hidden><button id="cancelInline" class="icon-button" aria-label="取消编辑"><svg><use href="#i-close"/></svg></button><div class="edit-history"><button id="editUndo" class="icon-button" aria-label="撤销本次操作"><svg><use href="#i-undo"/></svg></button><button id="editRedo" class="icon-button" aria-label="重做本次操作"><svg><use href="#i-redo"/></svg></button></div><button id="saveInline" class="icon-button" aria-label="确认编辑"><svg><use href="#i-check"/></svg></button></div><div id="viewport" class="preview-viewport"><div id="previewTrack" class="preview-track"></div></div><div class="screen-footer"><button id="previousStitch" class="button secondary previous-button" aria-label="上一步：排序"><svg class="back-icon"><use href="#i-right"/></svg></button><button id="nextExport" class="button primary full next-button" aria-label="下一步：导出"><svg><use href="#i-right"/></svg></button></div></section>
    <section id="exportScreen" class="screen" hidden><div id="exportDialog" class="export-content"><div class="export-art"><div id="exportThumb" class="export-thumb"></div><span class="ready-badge"><svg><use href="#i-check"/></svg></span></div><p id="exportDimensions"></p><div class="format-summary"><svg><use href="#i-images"/></svg><span id="formatSummary">PNG · 原尺寸</span><button id="moreOptions" class="icon-button" title="导出设置" aria-label="导出设置"><svg><use href="#i-sliders"/></svg></button></div><div id="exportOptions" hidden><div class="form-grid"><label>格式<select id="format"><option value="png">PNG · 无损</option><option value="jpeg">JPG · 有损</option></select></label><label>尺寸<select id="scale"><option value="1">100% · 原尺寸</option><option value="0.75">75%</option><option value="0.5">50%</option><option value="0.25">25%</option></select></label></div><label id="qualityLabel" hidden>JPG 质量<input id="quality" type="range" min="40" max="100" value="92"></label><label class="form-label">导出方式<select id="exportMode"><option value="single">完整长图</option><option value="segments">分段图片</option></select></label></div><div id="exportNotice" class="notice" hidden></div><label id="ackRow" class="acknowledge" hidden><input id="acknowledge" type="checkbox">保留重复内容</label><div id="downloadResults" class="download-results"></div></div><div class="screen-footer"><button id="previousExport" class="button secondary previous-button" aria-label="上一步：拼接"><svg class="back-icon"><use href="#i-right"/></svg></button><button id="generate" class="button primary full"><svg><use href="#i-download"/></svg>保存</button></div></section>
  </main>
</div>
<input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="progressArea" class="progress-overlay" hidden><div class="progress-leaf"><svg><use href="#i-leaf"/></svg></div><h2>正在接起来</h2><span id="progressText">读取图片</span><progress id="progress" max="100" value="0"></progress><button id="cancel" class="text-button">取消</button></div>
<dialog id="imageActions" class="action-sheet"><div class="sheet-handle"></div><div class="sheet-heading"><h2 id="selectedTitle">截图 1</h2><button class="icon-button close-dialog" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div><div class="action-grid"><button id="adjustImage"><svg><use href="#i-cut"/></svg><span>调整接缝</span></button><button id="cropImage"><svg><use href="#i-crop"/></svg><span>裁剪</span></button></div></dialog>
<dialog id="sortActions" class="action-sheet"><div class="sheet-handle"></div><div class="sheet-heading"><h2 id="sortTitle">调整顺序</h2><button class="icon-button close-dialog" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div><div class="action-grid"><button id="moveEarlier" title="前移" aria-label="前移"><svg><use href="#i-up"/></svg></button><button id="moveLater" title="后移" aria-label="后移"><svg><use href="#i-down"/></svg></button></div></dialog>
<dialog id="seamDialog" class="fullscreen-editor"><div class="editor-header"><button class="icon-button close-dialog" aria-label="取消"><svg><use href="#i-close"/></svg></button><h2 id="seamTitle">调整接缝</h2><button id="confirmSeam" class="icon-button done" aria-label="完成接缝调整"><svg><use href="#i-check"/></svg></button></div><div class="editor-stage"><div class="editor-stage-label"><span></span><button id="editorZoom" class="icon-button" aria-label="放大检查"><svg><use href="#i-eye"/></svg></button></div><div id="editorScroller"><canvas id="editorCanvas"></canvas></div></div><div class="editor-controls"><div id="editorStatus" class="small-note" hidden></div><div class="range-label"><svg aria-label="重叠"><use href="#i-cut"/></svg><input id="overlapNumber" type="number" min="0" step="1" aria-label="重叠像素"><span>px</span></div><input id="overlapRange" type="range" min="0" max="1000" aria-label="重叠长度"><div class="range-label"><svg aria-label="透明度"><use href="#i-eye"/></svg><span id="opacityValue">50%</span></div><input id="opacityRange" type="range" min="0" max="100" value="50" aria-label="叠加透明度"><details><summary aria-label="精细调整"><svg><use href="#i-sliders"/></svg></summary><div class="range-label"><span>裁切线</span><span id="cutValue">50%</span></div><input id="cutRange" type="range" min="0" max="100" value="50" aria-label="裁切位置"><button id="applySuggestion" class="icon-button" title="匹配建议" aria-label="匹配建议"><svg><use href="#i-spark"/></svg></button><button id="keepBoth" class="icon-button" title="保留两张" aria-label="保留两张"><svg><use href="#i-images"/></svg></button></details><p id="editorWarning" class="small-note"></p></div></dialog>
<dialog id="cropDialog" class="fullscreen-editor"><div class="editor-header"><button class="icon-button close-dialog" aria-label="取消"><svg><use href="#i-close"/></svg></button><h2 id="cropTitle">裁剪边缘</h2><button id="confirmCrop" class="icon-button done" aria-label="完成裁剪"><svg><use href="#i-check"/></svg></button></div><div id="cropViewport" class="crop-viewport"><div id="cropFrame" class="crop-frame"><img id="cropPreview" alt="当前截图"><div id="cropShadeStart" class="crop-shade start"></div><div id="cropShadeEnd" class="crop-shade end"></div><button id="cropHandleStart" class="crop-handle start" aria-label="拖动起始裁剪边缘"><i></i></button><button id="cropHandleEnd" class="crop-handle end" aria-label="拖动末尾裁剪边缘"><i></i></button></div></div><div class="crop-controls"><div class="form-grid"><label id="cropStartLabel">顶部<input id="cropStart" type="number" min="0" value="0"></label><label id="cropEndLabel">底部<input id="cropEnd" type="number" min="0" value="0"></label></div><button id="resetCrop" class="icon-button" title="恢复完整图片" aria-label="恢复完整图片"><svg><use href="#i-reset"/></svg></button></div></dialog>
<dialog id="infoDialog" class="info-dialog"><div class="sheet-heading"><h2 id="infoTitle"></h2><button class="icon-button close-dialog" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div><div id="infoBody"></div></dialog>
<script src="core.js?v=12"></script><script src="app.js?v=12"></script>
</body></html>
